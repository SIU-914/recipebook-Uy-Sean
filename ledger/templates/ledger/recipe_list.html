<h1>Recipe List</h1>

{% if user.is_authenticated %}
<a href="{% url 'recipe_add' %}">Add Recipe</a>
{% endif %}

<ul>
    {% for recipe in recipes %}
        <li>
            <a href="{{ recipe.get_absolute_url }}">
                {{ recipe.name }}
            </a>
        </li>
    {% empty %}
        <li>No recipes available.</li>
    {% endfor %}
</ul>
